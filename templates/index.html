{% extends "base.html" %}
{% block title %}Dominus - rent or buy{% endblock %}

{% block content %}
<h1>Dominus</h1>
<p>Compare renting and buying</p>

<!-- show the error in the html-->
{% if error %}
<div class="error">{{ error }}</div>
{% endif %}

<!-- drop down to pick suburb -->
<form action="{{ url_for('compare') }}" method="post" class="panel">
  <label>
    Suburb
    <select name="suburb" required>
      <option value="">-- choose --</option>
      {% for suburb_name in suburbs %}
      <option value="{{ suburb_name }}" {% if form_data.get('suburb') == suburb_name %}selected{% endif %}>
        {{ suburb_name }}
      </option>
      {% endfor %}
    </select>
  </label>

<!-- property type hard coded-->

  <label>
    Property type
    <select name="property_type" required>
      <option value="house" {% if form_data.get('property_type') == 'house' %}selected{% endif %}>House</option>
      <option value="unit" {% if form_data.get('property_type') == 'unit' %}selected{% endif %}>Unit</option>
    </select>
  </label>

<!-- 
  each field remembers what the user typed last time
  if the page is fresh, it shows an appropriate starting number
  The name on each field is how the server reads it when the form is submitted  
-->
  <label>
    Annual income ($)
    <input
      type="number"
      name="annual_income"
      min="1"
      step="100"
      value="{{ form_data.get('annual_income', '') }}"
      required
    />
  </label>
