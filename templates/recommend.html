{% extends "base.html" %} {% block title %}Dominus | Recommend a Suburb{%
endblock %} {% block content %}
<h1>Where should you buy?</h1>
<p>Enter your finances once and see every suburb ranked for you.</p>

<!-- error banner -> shown only when validation fails -->
{% if error %}
<div class="error">{{ error }}</div>
{% endif %}

<form action="{{ url_for('recommend') }}" method="post" class="panel">
  <label>
    Property type
    <select name="property_type" required>
      <option value="house">House</option>
      <option value="unit">Unit</option>
    </select>
  </label>

  <label>
    Annual income ($)
    <input
      type="number"
      name="annual_income"
      min="1"
      step="any"
      value=""
      required
    />
  </label>

  <label>
    Deposit / savings ($)
    <input type="number" name="deposit" min="1" step="any" value="" required />
  </label>

  <label>
    Horizon (years)
    <input type="number" name="horizon" min="1" value="5" required />
  </label>

  <label>
    Mortgage rate (%)
    <input
      type="number"
      name="mortgage_rate"
      min="0.1"
      step="any"
      value="6"
      required
    />
  </label>

  <label>
    Loan term (years)
    <input type="number" name="loan_term_years" min="1" value="30" required />
  </label>

  <label>
    Investment return rate (%)
    <input
      type="number"
      name="return_rate"
      min="0"
      step="any"
      value="7"
      required
    />
  </label>

  <button type="submit">Find best suburbs</button>
</form>
{% endblock %}
